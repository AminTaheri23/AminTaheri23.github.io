name: Build and deploy (Zola)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  ZOLA_VERSION: "0.23.6"

jobs:
  validate-data:
    name: Validate data files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate YAML files
        run: |
          python3 << 'PYEOF'
          import sys
          import yaml

          data_files = ['data/projects.yml', 'data/certificates.yml', 'data/photos.yml']
          failed = False
          for file in data_files:
              try:
                  with open(file, 'r') as f:
                      data = yaml.safe_load(f)
                  if not isinstance(data, list) or not data:
                      raise ValueError("expected a non-empty list")
                  print(f"OK   {file}: {len(data)} items")
              except Exception as e:
                  print(f"FAIL {file}: {e}")
                  failed = True
          if failed:
              sys.exit(1)
          print("\nAll data files valid.")
          PYEOF

  build:
    name: Build site
    runs-on: ubuntu-latest
    needs: validate-data
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Zola
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Zola version
        run: zola --version

      - name: Build
        run: zola build

      - name: Draw link-preview cards
        # The Open Graph images the pages point at (og/<slug>.png, og/default.png), drawn in the
        # runner's Chrome; the script fails if a page points at a card that is not there.
        env:
          OG_PUPPETEER: ${{ runner.temp }}/og-cards
        run: |
          npm install --prefix "$OG_PUPPETEER" --no-audit --no-fund --no-save puppeteer-core@24.43.1
          node scripts/og-cards.mjs public

      - name: Assert output
        run: |
          out=public
          missing=()
          for f in \
            index.html \
            gallery/index.html \
            certificates/index.html \
            gallery.html \
            cert_gal.html \
            projects.html \
            404.html \
            cv.pdf \
            AminTaheri_Jan26.pdf \
            img/amin.ico \
            og/default.png \
            og/certificates.png \
            og/gallery.png \
            css/site.css \
            js/site.js
          do
            [ -f "$out/$f" ] || missing+=("$out/$f")
          done
          status=0
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing build output: ${missing[*]}"
            printf 'missing: %s\n' "${missing[@]}"
            status=1
          fi
          if [ -e "$out/blog" ]; then
            echo "::error::$out/blog must not exist; /blog is served by a separate repository"
            status=1
          fi
          [ $status -eq 0 ] && echo "All expected files present; no $out/blog."
          exit $status

      - name: Configure Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Upload build for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: zola-site
          path: public
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
