<section id="contact" class="section contact" aria-labelledby="contact-heading">
  <div class="container contact__inner">
    <h2 id="contact-heading">Let's Get In Touch!</h2>
    <div class="contact__body">
      <p>Are you interested in my work? Do you have any feedback? That's great! Give me a call or send me an email and I will get back to you as soon as possible!</p>
      <a class="btn btn--primary" href="mailto:{{ config.extra.email }}">{{ <icon name="envelope" /> }}{{ config.extra.email }}</a>
    </div>
  </div>
</section>
